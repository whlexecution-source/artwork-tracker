<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artwork Job Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --ink:#1C1B1A;
  --surface:#242220;
  --surface-2:#2E2B28;
  --paper:#EDEAE3;
  --paper-dim:#C9C4B8;
  --line:#4A453F;

  --st-pending:#8B8680;
  --st-designing:#3D7EBF;
  --st-holding:#C9A227;
  --st-editing:#B14E3C;
  --st-investigating:#7A5CA8;
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--ink);
  background-image:
    radial-gradient(circle at 1px 1px, rgba(237,234,227,0.045) 1px, transparent 1px);
  background-size:22px 22px;
  color:var(--paper);
  font-family:'IBM Plex Sans Thai','IBM Plex Mono',sans-serif;
  min-height:100vh;
}

.wrap{max-width:1180px;margin:0 auto;padding:36px 24px 80px;}

/* ---------- Header ---------- */
.masthead{
  display:flex;justify-content:space-between;align-items:flex-end;
  border-bottom:2px solid var(--paper);
  padding-bottom:18px;margin-bottom:8px;flex-wrap:wrap;gap:16px;
}
.masthead-left{display:flex;align-items:baseline;gap:14px;}
.masthead h1{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  font-size:44px;
  letter-spacing:0.5px;
  margin:0;
  text-transform:uppercase;
}
.masthead .sub{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  color:var(--paper-dim);
  letter-spacing:1px;
}
.job-count{
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  color:var(--paper-dim);
  text-align:right;
}
.job-count b{color:var(--paper);font-size:20px;display:block;font-family:'Barlow Condensed',sans-serif;}
.conn-status{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  display:flex;align-items:center;gap:6px;margin-top:4px;justify-content:flex-end;
}
.conn-status .dot{width:7px;height:7px;border-radius:50%;background:var(--st-designing);}
.conn-status.err .dot{background:var(--st-editing);}

/* ---------- Toolbar ---------- */
.toolbar{
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  margin:22px 0 26px;
}
.tab{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  padding:8px 14px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--paper-dim);
  border-radius:3px;
  cursor:pointer;
  display:flex;align-items:center;gap:8px;
  transition:border-color .15s,color .15s;
  white-space:nowrap;
}
.tab .dot{width:8px;height:8px;border-radius:50%;flex:none;}
.tab:hover{color:var(--paper);border-color:var(--paper-dim);}
.tab.active{color:var(--ink);background:var(--paper);border-color:var(--paper);}
.tab.active .dot{outline:2px solid var(--ink);outline-offset:1px;}

.spacer{flex:1;}
.btn-add{
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  padding:9px 16px;
  background:var(--st-editing);
  color:var(--paper);
  border:none;border-radius:3px;
  cursor:pointer;
  letter-spacing:.5px;
}
.btn-add:hover{filter:brightness(1.1);}
.btn-add:disabled{opacity:.4;cursor:not-allowed;}

/* ---------- Grid ---------- */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:18px;
}
.empty{
  grid-column:1/-1;
  border:1px dashed var(--line);
  border-radius:4px;
  padding:60px 20px;
  text-align:center;
  color:var(--paper-dim);
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
}

/* ---------- Card (proof sheet) ---------- */
.card{
  position:relative;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:2px;
  overflow:hidden;
}
.card::before,.card::after{
  content:"";position:absolute;width:11px;height:11px;pointer-events:none;
}
.card::before{
  top:6px;left:6px;
  border-top:1px solid var(--paper-dim);
  border-left:1px solid var(--paper-dim);
  opacity:.6;
}
.card::after{
  bottom:6px;right:6px;
  border-bottom:1px solid var(--paper-dim);
  border-right:1px solid var(--paper-dim);
  opacity:.6;
}
.status-bar{height:5px;width:100%;}
.card-body{padding:16px 16px 14px;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
.code{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;color:var(--paper-dim);letter-spacing:1px;
}
.status-chip{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  padding:3px 9px;
  border-radius:20px;
  color:var(--ink);
  font-weight:600;
  white-space:nowrap;
  letter-spacing:.3px;
}
.title{
  font-family:'Barlow Condensed',sans-serif;
  font-size:22px;font-weight:600;
  margin:0 0 3px;
  line-height:1.15;
}
.client{
  font-size:12.5px;color:var(--paper-dim);margin:0 0 12px;
}

.preview{
  width:100%;aspect-ratio:16/10;
  background:var(--paper);
  border-radius:2px;
  overflow:hidden;
  margin-bottom:12px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  position:relative;
}
.preview img{width:100%;height:100%;object-fit:cover;display:block;}
.preview .noimg{
  color:#8b8680;font-family:'IBM Plex Mono',monospace;font-size:11px;
  text-align:center;padding:10px;
}
.preview .zoom-hint{
  position:absolute;bottom:6px;right:6px;
  background:rgba(28,27,26,0.7);color:var(--paper);
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;
  padding:2px 7px;border-radius:10px;opacity:0;transition:opacity .15s;
}
.preview:hover .zoom-hint{opacity:1;}

.note{
  font-size:12.5px;color:var(--paper-dim);
  margin:0 0 12px;line-height:1.5;
  border-left:2px solid var(--line);
  padding-left:9px;
}

.card-foot{display:flex;gap:8px;align-items:center;}
.dl-link{
  flex:1;
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  padding:9px 10px;
  background:var(--ink);
  color:var(--paper);
  border:1px solid var(--line);
  border-radius:3px;
  text-decoration:none;
  transition:border-color .15s;
}
.dl-link:hover{border-color:var(--paper-dim);}
.dl-link.disabled{opacity:.35;pointer-events:none;}
.icon-btn{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  padding:9px 11px;
  background:transparent;
  color:var(--paper-dim);
  border:1px solid var(--line);
  border-radius:3px;
  cursor:pointer;
}
.icon-btn:hover{color:var(--paper);border-color:var(--paper-dim);}
.updated{
  font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--paper-dim);
  margin-top:10px;opacity:.7;
}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(10,9,8,0.72);
  display:none;align-items:center;justify-content:center;
  padding:24px;z-index:50;
}
.overlay.show{display:flex;}
.modal{
  width:100%;max-width:480px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:4px;
  padding:26px;
  max-height:88vh;overflow-y:auto;
}
.modal h2{
  font-family:'Barlow Condensed',sans-serif;
  font-size:26px;text-transform:uppercase;margin:0 0 18px;
  letter-spacing:.5px;
}
.field{margin-bottom:14px;}
.field label{
  display:block;font-family:'IBM Plex Mono',monospace;
  font-size:11px;color:var(--paper-dim);margin-bottom:6px;letter-spacing:.5px;
}
.field input[type="text"],.field input[type="url"],.field select,.field textarea{
  width:100%;padding:10px 11px;
  background:var(--ink);border:1px solid var(--line);
  color:var(--paper);border-radius:3px;
  font-family:'IBM Plex Sans Thai',sans-serif;font-size:13.5px;
}
.field textarea{resize:vertical;min-height:56px;font-family:'IBM Plex Sans Thai',sans-serif;}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--paper-dim);
}
.status-select{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.status-opt{
  display:flex;align-items:center;gap:7px;
  padding:9px 10px;border:1px solid var(--line);border-radius:3px;
  cursor:pointer;font-size:12.5px;
}
.status-opt input{width:auto;margin:0;}
.status-opt .dot{width:9px;height:9px;border-radius:50%;flex:none;}
.status-opt.checked{border-color:var(--paper);background:rgba(237,234,227,0.05);}

.upload-box{
  border:1px dashed var(--line);border-radius:4px;padding:14px;
  display:flex;align-items:center;gap:12px;
}
.upload-box .thumb{
  width:60px;height:44px;border-radius:2px;background:var(--paper);
  overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;
}
.upload-box .thumb img{width:100%;height:100%;object-fit:cover;}
.upload-box .thumb .ph{font-family:'IBM Plex Mono',monospace;font-size:8px;color:#8b8680;}
.upload-box input[type="file"]{
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--paper-dim);flex:1;
}
.or-divider{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--paper-dim);
  text-align:center;margin:8px 0;letter-spacing:1px;
}

.modal-actions{display:flex;gap:10px;margin-top:20px;}
.modal-actions button{
  font-family:'IBM Plex Mono',monospace;font-size:13px;
  padding:11px 16px;border-radius:3px;border:1px solid var(--line);
  cursor:pointer;flex:1;
}
.btn-save{background:var(--st-editing);color:var(--paper);border-color:var(--st-editing);}
.btn-save:disabled{opacity:.5;cursor:not-allowed;}
.btn-cancel{background:transparent;color:var(--paper-dim);}
.btn-delete{background:transparent;color:var(--st-editing);border-color:var(--st-editing);flex:none;}

.lightbox{
  position:fixed;inset:0;background:rgba(10,9,8,0.9);
  display:none;align-items:center;justify-content:center;padding:30px;z-index:60;cursor:zoom-out;
}
.lightbox.show{display:flex;}
.lightbox img{max-width:100%;max-height:100%;border-radius:3px;}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--paper);color:var(--ink);
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;
  padding:11px 18px;border-radius:4px;
  opacity:0;pointer-events:none;transition:all .25s;z-index:70;
  max-width:80vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.loading,.error-box{
  grid-column:1/-1;text-align:center;padding:60px;
  font-family:'IBM Plex Mono',monospace;color:var(--paper-dim);font-size:13px;
}
.error-box{color:var(--st-editing);border:1px dashed var(--st-editing);border-radius:4px;}

@media (max-width:520px){
  .masthead h1{font-size:32px;}
  .status-select{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="masthead">
    <div class="masthead-left">
      <h1>Artwork Tracker</h1>
      <span class="sub">WHITELINE ACTIVATION — JOB STATUS BOARD</span>
    </div>
    <div>
      <div class="job-count"><b id="countNum">0</b>JOB ทั้งหมด</div>
      <div class="conn-status" id="connStatus"><span class="dot"></span><span id="connText">กำลังเชื่อมต่อ...</span></div>
    </div>
  </div>

  <div class="toolbar" id="toolbar"></div>

  <div class="grid" id="grid">
    <div class="loading">กำลังโหลดข้อมูล...</div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">เพิ่มงาน Artwork</h2>
    <input type="hidden" id="jobId">
    <div class="field">
      <label>รหัสงาน (Job Code)</label>
      <input type="text" id="fCode" placeholder="เช่น AW-2607-014">
    </div>
    <div class="field">
      <label>ชื่องาน / รายละเอียด</label>
      <input type="text" id="fTitle" placeholder="เช่น ป้ายหน้าร้าน สาขาสีคิ้ว">
    </div>
    <div class="field">
      <label>ผู้ขอ / ลูกค้า (ไม่บังคับ)</label>
      <input type="text" id="fClient" placeholder="เช่น ทีมการตลาด / ชื่อลูกค้า">
    </div>
    <div class="field">
      <label>สถานะ</label>
      <div class="status-select" id="statusSelect"></div>
    </div>
    <div class="field">
      <label>รูป Preview</label>
      <div class="upload-box">
        <div class="thumb" id="previewThumb"><span class="ph">ไม่มีรูป</span></div>
        <input type="file" id="fPreviewFile" accept="image/*">
      </div>
      <div class="or-divider">— หรือวางลิงก์รูปโดยตรง —</div>
      <input type="text" id="fPreviewUrl" placeholder="https://...">
    </div>
    <div class="field">
      <label>ลิงก์ดาวน์โหลดไฟล์ Artwork</label>
      <input type="text" id="fDownload" placeholder="https://...">
    </div>
    <div class="field">
      <label>หมายเหตุ (ไม่บังคับ)</label>
      <textarea id="fNote" placeholder="รายละเอียดเพิ่มเติม..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-delete" id="btnDelete" style="display:none;">ลบ</button>
      <button class="btn-cancel" id="btnCancel">ยกเลิก</button>
      <button class="btn-save" id="btnSave">บันทึก</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" src=""></div>
<div class="toast" id="toast"></div>

<script>
/* ================== ตั้งค่า Supabase ================== */
const SUPABASE_URL = "https://upbmntagxeixvwiicgvu.supabase.co";
const SUPABASE_KEY = "sb_publishable_C1Le6y9pjFg_-8g5lrR6Eg_U97pCWJ1";
const BUCKET = "artwork-previews";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const STATUSES = [
  { key:'pending', label:'Pending', th:'รอดำเนินการ', color:'var(--st-pending)' },
  { key:'designing', label:'Designing / Operating', th:'กำลังออกแบบ', color:'var(--st-designing)' },
  { key:'holding', label:'Holding', th:'พักงาน', color:'var(--st-holding)' },
  { key:'editing', label:'Editing', th:'กำลังแก้ไข', color:'var(--st-editing)' },
  { key:'investigating', label:'Investigating', th:'กำลังตรวจสอบ', color:'var(--st-investigating)' },
];
const statusMap = Object.fromEntries(STATUSES.map(s=>[s.key,s]));

let jobs = [];
let activeFilter = 'all';
let selectedFile = null;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}

function setConn(ok, text){
  const el = document.getElementById('connStatus');
  el.classList.toggle('err', !ok);
  document.getElementById('connText').textContent = text;
}

/* map แถวจากฐานข้อมูล -> ออบเจกต์ที่ใช้ในหน้าเว็บ */
function fromDb(row){
  return {
    id: row.id,
    jobCode: row.job_code || '',
    title: row.title || '',
    client: row.client || '',
    status: row.status || 'pending',
    preview: row.preview_url || '',
    download: row.download_url || '',
    note: row.note || '',
    updatedAt: row.updated_at,
  };
}

async function loadJobs(){
  const { data, error } = await sb.from('jobs').select('*').order('updated_at', { ascending:false });
  if(error){
    setConn(false, 'เชื่อมต่อไม่สำเร็จ');
    document.getElementById('grid').innerHTML = `<div class="error-box">โหลดข้อมูลไม่สำเร็จ: ${escapeHtml(error.message)}<br>ตรวจสอบว่าตั้งค่า Table + Policy ครบแล้วหรือยัง</div>`;
    return;
  }
  setConn(true, 'เชื่อมต่อแล้ว');
  jobs = data.map(fromDb);
  renderToolbar();
  renderGrid();
}

async function uploadPreviewFile(file){
  const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g,'_');
  const path = `${Date.now()}_${safeName}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file, { cacheControl:'3600', upsert:false });
  if(error) throw error;
  const { data } = sb.storage.from(BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

function renderToolbar(){
  const tb = document.getElementById('toolbar');
  const counts = {all: jobs.length};
  STATUSES.forEach(s=> counts[s.key] = jobs.filter(j=>j.status===s.key).length);

  let html = `<div class="tab ${activeFilter==='all'?'active':''}" data-filter="all">
    <span class="dot" style="background:var(--paper-dim)"></span> ทั้งหมด (${counts.all})
  </div>`;
  STATUSES.forEach(s=>{
    html += `<div class="tab ${activeFilter===s.key?'active':''}" data-filter="${s.key}">
      <span class="dot" style="background:${s.color}"></span> ${s.th} (${counts[s.key]})
    </div>`;
  });
  html += `<div class="spacer"></div><button class="btn-add" id="btnAddTop">+ เพิ่มงานใหม่</button>`;
  tb.innerHTML = html;

  tb.querySelectorAll('.tab').forEach(el=>{
    el.addEventListener('click', ()=>{
      activeFilter = el.dataset.filter;
      renderToolbar();
      renderGrid();
    });
  });
  document.getElementById('btnAddTop').addEventListener('click', ()=>openModal());
}

function renderGrid(){
  const grid = document.getElementById('grid');
  document.getElementById('countNum').textContent = jobs.length;

  const list = activeFilter==='all' ? jobs : jobs.filter(j=>j.status===activeFilter);

  if(list.length===0){
    grid.innerHTML = `<div class="empty">ยังไม่มีงานในหมวดนี้ — กด "เพิ่มงานใหม่" เพื่อเริ่มบันทึกสถานะ Artwork</div>`;
    return;
  }

  grid.innerHTML = list.map(job=>{
    const st = statusMap[job.status] || statusMap.pending;
    const dateStr = job.updatedAt ? new Date(job.updatedAt).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'}) : '';
    return `
    <div class="card">
      <div class="status-bar" style="background:${st.color}"></div>
      <div class="card-body">
        <div class="card-top">
          <span class="code">${escapeHtml(job.jobCode||'—')}</span>
          <span class="status-chip" style="background:${st.color}">${st.th.toUpperCase()}</span>
        </div>
        <p class="title">${escapeHtml(job.title||'ไม่มีชื่องาน')}</p>
        ${job.client ? `<p class="client">${escapeHtml(job.client)}</p>` : ''}
        <div class="preview" data-img="${escapeAttr(job.preview||'')}">
          ${job.preview
            ? `<img src="${escapeAttr(job.preview)}" alt="preview" onerror="this.parentElement.innerHTML='<div class=noimg>โหลดรูปไม่สำเร็จ</div>'"><span class="zoom-hint">คลิกเพื่อขยาย</span>`
            : `<div class="noimg">ไม่มีรูป Preview</div>`}
        </div>
        ${job.note ? `<p class="note">${escapeHtml(job.note)}</p>` : ''}
        <div class="card-foot">
          <a class="dl-link ${job.download?'':'disabled'}" href="${escapeAttr(job.download||'#')}" target="_blank" rel="noopener">⤓ ดาวน์โหลดไฟล์</a>
          <button class="icon-btn" data-edit="${job.id}">แก้ไข</button>
        </div>
        <div class="updated">${dateStr ? 'อัปเดตล่าสุด: '+dateStr : ''}</div>
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.preview').forEach(el=>{
    el.addEventListener('click', ()=>{
      const src = el.dataset.img;
      if(!src) return;
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.add('show');
    });
  });
  grid.querySelectorAll('[data-edit]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const job = jobs.find(j=>String(j.id)===el.dataset.edit);
      if(job) openModal(job);
    });
  });
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

/* ---------- Modal ---------- */
function renderStatusOptions(selected){
  const wrap = document.getElementById('statusSelect');
  wrap.innerHTML = STATUSES.map(s=>`
    <label class="status-opt ${selected===s.key?'checked':''}">
      <input type="radio" name="statusOpt" value="${s.key}" ${selected===s.key?'checked':''}>
      <span class="dot" style="background:${s.color}"></span> ${s.th}
    </label>
  `).join('');
  wrap.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      wrap.querySelectorAll('.status-opt').forEach(o=>o.classList.remove('checked'));
      inp.closest('.status-opt').classList.add('checked');
    });
  });
}

function openModal(job){
  selectedFile = null;
  document.getElementById('modalTitle').textContent = job ? 'แก้ไขงาน Artwork' : 'เพิ่มงาน Artwork';
  document.getElementById('jobId').value = job ? job.id : '';
  document.getElementById('fCode').value = job ? job.jobCode||'' : '';
  document.getElementById('fTitle').value = job ? job.title||'' : '';
  document.getElementById('fClient').value = job ? job.client||'' : '';
  document.getElementById('fPreviewUrl').value = job ? job.preview||'' : '';
  document.getElementById('fPreviewFile').value = '';
  document.getElementById('fDownload').value = job ? job.download||'' : '';
  document.getElementById('fNote').value = job ? job.note||'' : '';
  renderStatusOptions(job ? job.status : 'pending');
  updateThumb(job ? job.preview : '');
  document.getElementById('btnDelete').style.display = job ? 'block' : 'none';
  document.getElementById('overlay').classList.add('show');
  document.getElementById('fTitle').focus();
}
function closeModal(){
  document.getElementById('overlay').classList.remove('show');
}
function updateThumb(url){
  const thumb = document.getElementById('previewThumb');
  thumb.innerHTML = url ? `<img src="${escapeAttr(url)}">` : `<span class="ph">ไม่มีรูป</span>`;
}

document.getElementById('fPreviewFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  selectedFile = file;
  const reader = new FileReader();
  reader.onload = ev => updateThumb(ev.target.result);
  reader.readAsDataURL(file);
});
document.getElementById('fPreviewUrl').addEventListener('input', (e)=>{
  if(!selectedFile) updateThumb(e.target.value);
});

document.getElementById('btnCancel').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id==='overlay') closeModal();
});
document.getElementById('lightbox').addEventListener('click', ()=>{
  document.getElementById('lightbox').classList.remove('show');
});

document.getElementById('btnSave').addEventListener('click', async ()=>{
  const title = document.getElementById('fTitle').value.trim();
  if(!title){ toast('กรุณากรอกชื่องาน'); return; }

  const btnSave = document.getElementById('btnSave');
  btnSave.disabled = true;
  btnSave.textContent = 'กำลังบันทึก...';

  try{
    let previewUrl = document.getElementById('fPreviewUrl').value.trim();
    if(selectedFile){
      toast('กำลังอัปโหลดรูป...');
      previewUrl = await uploadPreviewFile(selectedFile);
    }

    const statusInput = document.querySelector('input[name="statusOpt"]:checked');
    const dbData = {
      job_code: document.getElementById('fCode').value.trim(),
      title,
      client: document.getElementById('fClient').value.trim(),
      status: statusInput ? statusInput.value : 'pending',
      preview_url: previewUrl,
      download_url: document.getElementById('fDownload').value.trim(),
      note: document.getElementById('fNote').value.trim(),
      updated_at: new Date().toISOString(),
    };

    const id = document.getElementById('jobId').value;
    let error;
    if(id){
      ({ error } = await sb.from('jobs').update(dbData).eq('id', id));
    }else{
      ({ error } = await sb.from('jobs').insert([dbData]));
    }
    if(error) throw error;

    toast(id ? 'บันทึกการแก้ไขแล้ว' : 'เพิ่มงานใหม่แล้ว');
    closeModal();
    await loadJobs();
  }catch(err){
    toast('เกิดข้อผิดพลาด: ' + err.message);
  }finally{
    btnSave.disabled = false;
    btnSave.textContent = 'บันทึก';
  }
});

document.getElementById('btnDelete').addEventListener('click', async ()=>{
  const id = document.getElementById('jobId').value;
  if(!id) return;
  if(!confirm('ต้องการลบงานนี้ใช่หรือไม่?')) return;
  const { error } = await sb.from('jobs').delete().eq('id', id);
  if(error){ toast('ลบไม่สำเร็จ: '+error.message); return; }
  closeModal();
  toast('ลบงานแล้ว');
  await loadJobs();
});

loadJobs();
</script>
</body>
</html>
